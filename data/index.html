<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>PWM 控制器</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 顶部导航栏 -->
    <header class="header">
      <div class="header-brand">
        <h1 class="header-title">PWM 控制器</h1>
        <span class="header-version" id="firmwareVersion">v--</span>
      </div>
      <div class="header-actions">
        <a
          href="https://github.com/ShouChenICU/PWM-Controller"
          target="_blank"
          class="btn-icon"
          title="GitHub 仓库"
        >
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
            ></path>
          </svg>
        </a>
        <button class="btn-icon" id="btnSettings" title="系统设置">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </div>
    </header>

    <!-- 主内容区 -->
    <main class="main">
      <!-- 设备卡片列表 -->
      <div class="device-list" id="deviceList">
        <!-- JS 动态渲染 -->
      </div>

      <!-- 空状态提示 -->
      <div class="empty-state" id="emptyState" style="display: none">
        <p>暂无设备</p>
        <p>点击下方按钮添加第一个设备</p>
      </div>

      <!-- 添加设备按钮 -->
      <button class="btn-add" id="btnAddDevice">+ 添加设备</button>
    </main>

    <!-- 提示消息 -->
    <div class="toast" id="toast"></div>

    <!-- ===== 设备详情弹窗 ===== -->
    <div class="modal" id="modalDeviceDetail">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="detailTitle">设备详情</h2>
          <button class="btn-close" id="btnCloseDetail">&times;</button>
        </div>
        <div class="modal-body">
          <div class="duty-display">
            <div class="duty-current">
              <span class="duty-value" id="detailDutyValue">10</span>
              <span class="duty-unit">%</span>
              <span class="duty-tag">当前</span>
            </div>
            <div class="duty-saved-row">
              已保存：<span id="detailSavedDutyValue">10</span>%
            </div>
          </div>
          <div class="slider-container">
            <button class="btn-step" id="btnDutyMinus" title="减少 1%">
              -
            </button>
            <input
              type="range"
              class="slider"
              id="detailDutySlider"
              min="0"
              max="100"
              value="10"
            />
            <button class="btn-step" id="btnDutyPlus" title="增加 1%">+</button>
          </div>
          <div class="slider-labels">
            <span>0%</span>
            <span>50%</span>
            <span>100%</span>
          </div>

          <div class="detail-info" id="detailInfo">
            <!-- 设备引脚信息由 JS 填充 -->
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-danger" id="btnDeleteDevice">删除设备</button>
          <button class="btn" id="btnEditDevice">编辑配置</button>
          <button class="btn btn-primary" id="btnSaveDuty">保存占空比</button>
        </div>
      </div>
    </div>

    <!-- ===== 添加/编辑设备弹窗 ===== -->
    <div class="modal" id="modalAddDevice">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="addDeviceTitle">添加设备</h2>
          <button class="btn-close" id="btnCloseAdd">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="inputDeviceName">设备名称</label>
            <input
              type="text"
              id="inputDeviceName"
              placeholder="如：机箱风扇"
              maxlength="20"
            />
          </div>
          <div class="form-group">
            <label for="inputPwmPin">PWM 输出引脚</label>
            <input
              type="number"
              id="inputPwmPin"
              placeholder="可用：0,1,3-8,10,18,19"
              min="0"
              max="21"
            />
          </div>
          <div class="form-group">
            <label for="inputRpmPin">转速读取引脚（可选）</label>
            <input
              type="number"
              id="inputRpmPin"
              placeholder="可用：0-8(不含9),10,18,19"
              min="-1"
              max="21"
            />
          </div>
          <div class="form-group checkbox-group">
            <input type="checkbox" id="inputInverted" />
            <label for="inputInverted">外部驱动反相 (10% → 90%)</label>
          </div>
          <div class="form-group">
            <label for="inputPulsesPerRevolution">转速信号每转脉冲数</label>
            <input
              type="number"
              id="inputPulsesPerRevolution"
              min="1"
              max="8"
              value="2"
            />
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn" id="btnCancelAdd">取消</button>
          <button class="btn btn-primary" id="btnConfirmAdd">确认添加</button>
        </div>
      </div>
    </div>

    <!-- ===== 系统设置弹窗 ===== -->
    <div class="modal" id="modalSettings">
      <div class="modal-content">
        <div class="modal-header">
          <h2>系统设置</h2>
          <button class="btn-close" id="btnCloseSettings">&times;</button>
        </div>
        <div class="modal-body">
          <h3>WiFi 配置</h3>
          <div class="settings-section">
            <div class="form-group">
              <label for="inputWifiSsid">WiFi SSID</label>
              <input type="text" id="inputWifiSsid" placeholder="WiFi 名称" />
            </div>
            <div class="form-group">
              <label for="inputWifiPass">WiFi 密码</label>
              <input type="password" id="inputWifiPass" placeholder="WiFi 密码" />
            </div>
            <div class="wifi-status" id="wifiStatus">
              <!-- WiFi 状态由 JS 填充 -->
            </div>
            <button class="btn btn-primary" id="btnSaveWifi">保存 WiFi</button>
          </div>

          <h3>网页登录</h3>
          <div class="settings-section">
            <div class="form-group">
              <label for="inputWebUsername">登录用户名</label>
              <input
                type="text"
                id="inputWebUsername"
                maxlength="32"
                autocomplete="username"
                placeholder="1～32 位字母、数字、点、下划线或连字符"
              />
            </div>
            <div class="form-group">
              <label for="inputWebPassword">新密码</label>
              <input
                type="password"
                id="inputWebPassword"
                minlength="8"
                maxlength="64"
                autocomplete="new-password"
                placeholder="8～64 位"
              />
            </div>
            <div class="form-group">
              <label for="inputWebPasswordConfirm">确认新密码</label>
              <input
                type="password"
                id="inputWebPasswordConfirm"
                minlength="8"
                maxlength="64"
                autocomplete="new-password"
                placeholder="再次输入新密码"
              />
            </div>
            <p class="settings-hint">保存后控制器会重启，请使用新凭据重新登录。</p>
            <button class="btn btn-primary" id="btnSaveWebAuth">保存登录设置</button>
          </div>

          <h3>系统信息</h3>
          <div class="system-info" id="systemInfo">
            <!-- 系统信息由 JS 填充 -->
          </div>

          <h3>恢复出厂设置</h3>
          <div class="reset-settings">
            <p>清空设备列表、WiFi 和网页登录配置，并自动重启控制器。此操作无法撤销。</p>
            <button class="btn btn-danger" id="btnResetSettings">
              清空 NVS 并重启
            </button>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn" id="btnCancelSettings">取消</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
